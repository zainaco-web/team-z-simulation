<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team Z Coaching Pilot — Simulation Engine (Phase 1 Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505; --panel:#0d0d0d; --panel2:#141414; --border:#252525;
    --text:#e8eaed; --text2:#9aa3ad; --text3:#6b7480;
    --accent:#2458d9; --accent2:#4a75e6; --agent:#2458d9;
    --ok:#3ecf8e; --warn:#e2a33d; --bad:#e05a5a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;}
  .app{display:grid;grid-template-rows:56px 1fr;height:100vh;}

  .topbar-global{grid-column:1/-1;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;}
  .topbar-search{flex:1;max-width:640px;margin:0 auto;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:10px;color:var(--text3);font-size:13px;}
  .topbar-search kbd{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:10.5px;color:var(--text3);margin-left:auto;}
  .topbar-badge{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;}
  .topbar-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
  .aht-toggle-wrap{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:12.5px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;}
  .aht-switch{position:relative;display:inline-block;width:34px;height:19px;}
  .aht-switch input{opacity:0;width:0;height:0;}
  .aht-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:20px;transition:.15s;}
  .aht-slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:2.5px;background:#fff;border-radius:50%;transition:.15s;}
  .aht-switch input:checked + .aht-slider{background:var(--accent);}
  .aht-switch input:checked + .aht-slider:before{transform:translateX(15px);}
  .aht-live-timer{font-size:12.5px;color:var(--warn);font-weight:600;display:flex;align-items:center;gap:5px;}
  .aht-result-box{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .aht-result-box.efficient{border-color:#1d3a2c;background:#0f1f16;}
  .aht-result-box.acceptable{border-color:#4a3a1a;background:#241d0f;}
  .aht-result-box.needs-improvement{border-color:#4a1a1a;background:#241010;}
  .aht-result-box.qualified{border-color:var(--warn);background:#241d0f;}

  .body-grid{display:grid;grid-template-columns:60px 280px 1fr 340px;overflow:hidden;}

  .icon-rail{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;}
  .icon-rail .irow{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:default;position:relative;}
  .icon-rail .irow.active{background:var(--panel2);color:var(--text);}
  .icon-rail .irow svg{width:18px;height:18px;}
  .icon-rail .badge{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:9px;font-weight:700;border-radius:10px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .icon-rail .spacer{flex:1;}
  .icon-rail .rail-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;margin-top:6px;}

  .rail{background:var(--panel);border-right:1px solid var(--border);padding:0;overflow-y:auto;display:flex;flex-direction:column;}
  .rail .rail-header{padding:16px 16px 10px;}
  .rail h1{font-size:18px;margin:0 0 2px;font-weight:700;}
  .rail .sub{color:var(--text3);font-size:12px;}
  .queue-label{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;font-size:13px;font-weight:600;color:var(--text);}
  .queue-label .count{color:var(--text3);font-weight:400;}
  .skillgroup{margin-bottom:4px;padding:0 10px;}
  .skillgroup h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin:14px 6px 6px;}
  .scenario-card{background:transparent;border:1px solid transparent;border-radius:10px;padding:9px 8px;margin-bottom:2px;cursor:pointer;transition:background .12s;display:flex;gap:10px;align-items:flex-start;}
  .scenario-card:hover{background:var(--panel2);}
  .scenario-card.active{background:#1a2030;border-color:#2a3550;}
  .scenario-card .qavatar{flex-shrink:0;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
  .scenario-card .qbody{min-width:0;flex:1;}
  .scenario-card .title{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .scenario-card .qsub{font-size:11.5px;color:var(--text3);}
  .diff-pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.02em;}
  .diff-Foundation{background:#1d3a2c;color:var(--ok);}
  .diff-Applied{background:#3a301a;color:var(--warn);}
  .diff-Advanced{background:#3a1d1d;color:var(--bad);}
  .rg-pill{display:inline-block;font-size:9.5px;padding:2px 6px;border-radius:20px;font-weight:700;letter-spacing:.02em;background:#3a1d1d;color:var(--bad);margin-left:5px;}
  .diag-link-wrap{padding:12px 16px;border-top:1px solid var(--border);margin-top:auto;}

  .main{display:flex;flex-direction:column;background:#0d1013;overflow:hidden;}
  .topbar{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .topbar .who{font-weight:600;font-size:15px;}
  .topbar .status{font-size:12px;color:var(--text3);}
  .topbar .btns{display:flex;gap:8px;align-items:center;}
  .topbar .chrome-icons{display:flex;gap:14px;color:var(--text3);margin-right:10px;}
  .topbar .chrome-icons svg{width:16px;height:16px;}
  button{font-family:inherit;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:8px 14px;cursor:pointer;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.primary:hover{background:var(--accent2);}
  button.small{padding:4px 10px;font-size:11.5px;}
  button:disabled{opacity:.4;cursor:not-allowed;}

  .started-divider{text-align:center;margin:6px 0 18px;}
  .started-divider span{background:#eeeeee;border:1px solid #d8d8d8;color:#6b7280;font-size:11.5px;padding:5px 14px;border-radius:20px;}
  .prechat-card{background:#eeeeee;border:1px solid #d8d8d8;border-radius:12px;padding:16px 18px;margin-bottom:16px;max-width:78%;}
  .prechat-card .pctitle{color:#111318;font-weight:700;font-size:13.5px;margin-bottom:10px;}
  .prechat-card .pcq{color:#8a919c;font-size:12.5px;margin-top:10px;}
  .prechat-card .pca{color:#111318;font-size:13.5px;margin-top:2px;}

  .chatlog{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;background:#f5f5f5;}
  .msg{max-width:62%;padding:11px 15px;border-radius:14px;line-height:1.45;}
  .msg .who{font-size:11px;margin-bottom:3px;}
  .msg.player{align-self:flex-start;background:#e4e4e5;border:1px solid #d8d8d8;border-bottom-left-radius:4px;color:#111318;}
  .msg.player .who{color:#8a919c;}
  .msg.agent{align-self:flex-end;background:var(--agent);color:#fff;border-bottom-right-radius:4px;}
  .msg.agent .who{color:#c9d8ff;}
  .msg.system{align-self:center;color:#8a919c;font-size:12px;font-style:italic;background:none;border:none;}
  .typing{align-self:flex-start;color:#8a919c;font-size:12px;padding-left:4px;}

  .composer{padding:14px 20px;border-top:1px solid #d8d8d8;display:flex;gap:10px;background:#f5f5f5;}
  .composer textarea{flex:1;resize:none;background:#eeeeee;border:1px solid #d8d8d8;border-radius:10px;color:#111318;padding:11px 13px;font-family:inherit;font-size:14px;height:44px;}
  .composer textarea::placeholder{color:#9aa1ab;}
  .composer textarea:focus{outline:none;border-color:var(--accent);}

  .side{background:var(--panel);border-left:1px solid var(--border);padding:0;overflow-y:auto;}
  .side-icons{display:flex;gap:16px;padding:14px 16px;border-bottom:1px solid var(--border);color:var(--text3);}
  .side-icons svg{width:17px;height:17px;}
  .side-identity{text-align:center;padding:22px 16px 18px;border-bottom:1px solid var(--border);}
  .side-identity .savatar{width:56px;height:56px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;margin:0 auto 10px;}
  .side-identity .sname{font-weight:700;font-size:16px;}
  .side-identity .ssub{color:var(--text3);font-size:12.5px;margin-top:3px;}
  .side-section{border-bottom:1px solid var(--border);}
  .side-section-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:default;}
  .side-section-head h2{font-size:13px;font-weight:600;color:var(--text);margin:0;text-transform:none;letter-spacing:0;}
  .side-section-head svg{width:14px;height:14px;color:var(--text3);}
  .side-section-body{padding:0 16px 16px;}
  .info-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.03);}
  .info-row:last-child{border-bottom:none;}
  .info-row .ilabel{color:var(--text3);}
  .info-row .ival{color:var(--text);text-align:right;}
  .box{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;font-size:13px;line-height:1.5;color:var(--text2);}
  .box.title{color:var(--text);font-weight:600;font-size:14px;}
  .empty{color:var(--text3);font-size:13px;padding:20px 0;text-align:center;}

  .kb-banner{font-size:11px;color:var(--warn);border:1px solid #4a3a1a;background:#241d0f;padding:6px 9px;border-radius:6px;margin-bottom:10px;line-height:1.4;}
  .rg-banner{font-size:11px;color:var(--bad);border:1px solid #4a1a1a;background:#241010;padding:6px 9px;border-radius:6px;margin-bottom:10px;line-height:1.4;font-weight:600;}

  .tab-group{margin-bottom:6px;}
  .tab-group .tab-name{font-size:11.5px;font-weight:700;color:var(--text2);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.03em;}
  .case-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:7px;}
  .case-card .clabel{font-size:12px;font-weight:600;margin-bottom:3px;}
  .case-card .cvalue{font-size:12.5px;color:var(--text2);line-height:1.5;}
  .case-card .gated-msg{font-size:12px;color:var(--text3);font-style:italic;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:760px;width:92%;max-height:86vh;overflow-y:auto;padding:26px 30px;}
  .modal h2{margin-top:0;}
  .rubric-row{border-top:1px solid var(--border);padding:14px 0;}
  .rubric-row .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .rubric-row .label{font-weight:600;font-size:13.5px;}
  .rubric-row .aiVal{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);}
  .rubric-row .aiVal.af{background:#3a1d1d;color:var(--bad);border-color:#5a2c2c;font-weight:700;}
  .score-badge{font-size:38px;font-weight:700;line-height:1.1;}
  .score-label{font-size:12px;color:var(--text3);margin-top:4px;}
  .rubric-row .cite{font-size:12.5px;color:var(--text2);line-height:1.5;margin-bottom:8px;}
  .rubric-row select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:12.5px;font-family:inherit;}
  .rubric-row textarea.notes{width:100%;margin-top:6px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:7px 9px;font-family:inherit;font-size:12.5px;resize:vertical;min-height:36px;}
  .critical{color:var(--bad);font-weight:700;}
  .tag-autofail{background:#3a1d1d;color:var(--bad);border:1px solid #5a2c2c;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;margin-left:8px;}

  .diag-section{border-top:1px solid var(--border);margin-top:20px;padding-top:16px;}
  .diag-result{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12.5px;line-height:1.5;}
  .diag-pass{color:var(--ok);font-weight:700;}
  .diag-fail{color:var(--bad);font-weight:700;}

  .category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;max-width:900px;}
  .category-tile{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:transform .1s;}
  .category-tile:hover{transform:translateY(-2px);border-color:var(--accent);}
  .category-tile-icon{margin-bottom:10px;}
  .category-tile-title{font-weight:700;font-size:15px;margin-bottom:4px;}
  .category-tile-sub{font-size:12px;color:var(--text3);}
  .category-scenario-card{display:flex;align-items:center;gap:14px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;max-width:700px;cursor:pointer;transition:border-color .1s;}
  .category-scenario-card:hover{border-color:var(--accent);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ============================================================
   TEAM Z COACHING PILOT — PHASE 1 PROTOTYPE (Corrected build)
   Scenario/player content is fictional training data - no real Betty player accounts involved.
   Chat/scoring calls and shared Team Progress + TL Assignments run through a real backend server
   (see BACKEND_URL below), with attempt data persisted server-side, not just in this browser tab.

   DATA MODEL, per the corrected spec:
  - playerKnowledge / personaPrompt: ONLY what the customer would realistically know/say.
  - caseData: what the AGENT can investigate (Investigation panel). Some cards
     visible immediately, some gated behind an "Investigate" action.
  - processGrounding: KB-grounded process content used ONLY by the evaluator,
     never shown to the player engine. Each scenario carries its own kbStatus -
     'validated' (real, authoritative Betty KB), 'coaching' (real, documented
     TL/QA coaching direction, not a formal KB article), 'mixed' (some real,
     some fictional - see kbSource), 'ambiguous' (real KB checked, genuinely
     doesn't resolve the case), or 'fictional' (invented/placeholder, prototype-
     only). kbBannerFor() shows the right banner for each status. Only treat
     'fictional' content as a real-world correctness standard once it's been
     replaced with validated (or at least coaching-grounded) content.
   ============================================================ */

const KB_NOT_VALIDATED_BANNER = "PROCESS NOT YET KB-VALIDATED - ENGINE TEST ONLY. Process content below is fictional/placeholder, not real Betty KB. Do not use for real Team Z coaching until replaced with validated KB content.";
const KB_AMBIGUOUS_BANNER = "GENUINE KB GAP - real Betty KB was checked, but it does not clearly resolve this exact case. This scenario deliberately tests whether an agent recognizes ambiguity and loops in a TL, rather than confidently guessing either direction.";

function kbBannerFor(s){
  if(s.kbStatus==='validated'){
    return `<div class="kb-banner" style="color:var(--ok);border-color:#1d3a2c;background:#0f1f16;">\u2713 KB-VALIDATED: ${escapeHtml(s.kbSource||'')}</div>`;
  }
  if(s.kbStatus==='mixed'){
    return `<div class="kb-banner">MIXED KB STATUS: ${escapeHtml(s.kbSource||'')}</div>`;
  }
  if(s.kbStatus==='ambiguous'){
    return `<div class="kb-banner">${escapeHtml(KB_AMBIGUOUS_BANNER)}<br><br>${escapeHtml(s.kbSource||'')}</div>`;
  }
  if(s.kbStatus==='coaching'){
    return `<div class="kb-banner" style="color:var(--warn);border-color:#4a3a1a;background:#241d0f;">${escapeHtml(KB_COACHING_GROUNDED_BANNER)}<br><br>${escapeHtml(s.kbSource||'')}</div>`;
  }
  return `<div class="kb-banner">${escapeHtml(KB_NOT_VALIDATED_BANNER)}</div>`;
}
const KB_COACHING_GROUNDED_BANNER = "COACHING-GROUNDED - Based on documented real TL/QA coaching, not a formal Betty KB article. Appropriate for coaching/practice, but not a KB citation.";
const RG_ENGINE_TEST_BANNER = "ENGINE TEST / FICTIONAL PROCESS - NOT APPROVED FOR REAL AGENT PROCESS TRAINING. This scenario includes fictional RG-adjacent content used only to test whether the engine can detect an embedded signal. No fictional RG procedure here should be treated as real Betty process.";

const GLOBAL_EVAL_RULES = `GLOBAL EVALUATION RULES (apply to every criterion below):
1. Never penalize the agent for failing to state, use, or act on information that was not made available to them in this simulation - not by the player, not in Available Case Data, not in Process Grounding.
2. Never reward the agent for confidently stating information not supported by the player, Available Case Data, or Process Grounding. Confident invention is a negative, not a neutral - note it in the citation.
3. If Process Grounding does not contain enough information to judge a criterion, respond "Cannot Determine From Authoritative Material" (or "Not Applicable" for demonstration-scale criteria) rather than guessing.
4. Process Grounding varies by scenario. Respect the scenario's KB status as stated below - validated content may be treated as authoritative; mixed, ambiguous, and fictional content must be handled according to their labels. Evaluate the agent against what's actually supplied for THIS scenario, not against your own general knowledge of real support policy, and not against a blanket assumption that everything is fictional.
5. INVESTIGATION vs. OPERATIONAL actions are graded on different evidence. The Agent Action Log is ground truth ONLY for investigation actions (checking Case Data via an Investigate button) - it does not exist to track operational/execution actions like applying a promo, restricting deposits, or starting a self-exclusion, because this prototype has no UI button for those. For an operational action with no corresponding UI control, a clear, specific statement in the transcript ("I've applied the exception," "I've restricted your deposits") IS sufficient evidence that the action was taken - do not treat the absence of an Action Log entry as evidence the action didn't happen when no UI existed to log it in the first place. Only doubt an operational claim if it's vague, contradicted elsewhere in the transcript, or asserts something Process Grounding says isn't actually possible.
6. SCORING IS IMPACT-BASED, NOT CHECKLIST-BASED. Process Grounding's requiredActions describe what good handling typically looks like - they are not a hidden checklist where every omitted step automatically causes a large deduction. For every potential deduction, ask: what was the actual or predictable impact of this specific miss on the player or the case? A risk that never materialized and predictably would not materialize (e.g. a minor step skipped with no realistic downstream consequence) is a coaching comment worth noting in the citation, not an automatic letter-grade drop. Reserve larger deductions (D/F/AF) for misses with real or predictable cost, not procedural incompleteness alone.
7. DO NOT DOUBLE-DEDUCT THE SAME ROOT CAUSE. If a single mistake affects both Resolution & Obligations (Q1) and Player Experience (Q2), only deduct in both if it genuinely created two separate impacts - one on the correctness/completeness of the outcome, and a distinct one on how the interaction felt to the player. If it's really one impact viewed from two angles, deduct once, in whichever question it most directly belongs to, and note the connection in the other question's citation without deducting there too.
8. Q1 (Resolution & Obligations) requires SPECIFIC evidence - cite the exact transcript turn(s) or, where relevant, the Agent Action Log. Do not deduct on Q1 based on a general impression of the chat; every Q1 letter below A must trace to a specific, quotable moment or a specific missing action with real predictable cost.
9. Q2 (Player Experience) may be judged more holistically than Q1 - use representative turns as evidence, but the letter should reflect the overall pattern and feel of the interaction across its full arc, not a single isolated line taken out of context.
10. Q3 (Documentation) is based STRICTLY on the submitted note and tag(s) after the chat ends. Never infer documentation quality from how the live chat itself went - a great chat with a thin note still scores low on Q3, and a rough chat with an accurate, complete note scores well on Q3. These are genuinely independent.
11. NEVER apply an automatic deduction for a scripted or checklist-style behaviour that Process Grounding does not specifically require for this scenario (e.g. do not penalize by default for not asking "is there anything else I can help with" unless failing to do so had an actual, specific impact in this transcript - and even then, evidence and impact must be cited, not assumed from the behaviour's absence alone).
12. Real Betty Chat Guidelines require confirming the relevant game or promotion name early in a chat. This is real, current guidance - but treat it the same as rule 6: judge by impact, not by presence/absence alone. If the agent never explicitly confirmed the game/promo name but the transcript shows no resulting confusion, wrong-item investigation, or wasted turns, this is at most a minor citation note, not a deduction. Only reflect it in the score if skipping it demonstrably caused incomplete investigation, confusion, or another real consequence in this specific transcript.`;

/* ============================================================
   REAL BETTY QA SCORECARD - replaces the old per-scenario
   custom rubric. This is the actual scorecard real chats are
   graded against (source: official scorecard export). Applies
   uniformly to every scenario. Scenario-specific processGrounding
   still matters - it's the material the evaluator uses to judge
   Q1 (Resolution & Obligations) correctly for THIS scenario.
   ============================================================ */
const QA_SCORECARD = {
  passThresholdPct: 85,
  afDuties: ['Responsible Gambling', 'Privacy', 'Conduct', 'Company Exposure'],
  questions: [
    {
      id: 'q1', label: 'Resolution & Obligations', weightPct: 55, maxPts: 11,
      question: 'Did the player get the right outcome, handled per our procedures and duties?',
      letters: {
        A: { pts: 11, pct: 55, def: 'The player got a correct and complete answer through the right process. Root cause found - or correctly escalated when it genuinely couldn\u2019t be resolved here. Ownership stayed on our side; the player left knowing exactly where things stand.' },
        B: { pts: 10, pct: 50, def: 'Right outcome, minor issue. A small detour, an unnecessary step, a slightly incomplete explanation, or a minor process deviation with no consequence - worth naming, but with little to no effect on the player or internal work.' },

function computeQAScore(questions){
  // questions: [{id, letter, afDuty?}, ...] - deterministic, does not trust model arithmetic
  const afHit = questions.find(q => q.letter === 'AF');
  if(afHit){
    return { pct: 0, pass: false, af: true, afDuty: afHit.afDuty || 'Unspecified', totalPts: 0 };
  }
  let totalPts = 0;
  questions.forEach(q => {
    const qDef = QA_SCORECARD.questions.find(x => x.id === q.id);
    const letterDef = qDef.letters[q.letter];
    totalPts += letterDef ? letterDef.pts : 0;
  });
  const pct = totalPts * 5;
  return { pct, pass: pct >= QA_SCORECARD.passThresholdPct, af: false, afDuty: null, totalPts };
}

    kbSource:'CORRECTED per direct operational correction: players never come into chat for a document out of nowhere - there\u2019s always a trigger. The real pattern: Risk or Compliance emails the player requesting something (ID, card copies, etc.) with a timeframe; if unanswered, a restriction follows (Risk typically disables deposits and gameplay while leaving withdrawals open, per direct TL input - not itself drawn from a KB document), and the player comes to chat confused about the restriction, not about the document. The document types (ID + selfie, card copies) are real per the Fraud Requests Cheatsheet; escalating them to Risk once received is real per Risk & Fraud Escalations. The check-in-is-the-signal AHT judgment call underneath this is unchanged from the prior version.',

    },
    personaPrompt:'You are Priya. Open confused and a little annoyed - "why can\u2019t I deposit, is something broken?" If the agent explains there was an email requesting your ID that went unanswered, react with mild embarrassment/vague recollection - "oh... maybe I did see something like that, sorry, I\u2019ve been busy." Once you understand what\u2019s needed (a photo of your ID), say something like "oh sure, one sec, I think I know where that is" - you sound like it\u2019ll be quick. After a short wait, check back in yourself with something like "sorry, still looking, give me a bit more" - said apologetically, not frustrated. If the agent responds with just "no worries, take your time" and nothing else, wait again and check in ONE more time with "almost got it, sorry" - still apologetic, still taking a while. If the agent instead responds to your check-in by offering that you can email the document to support@betty.ca once you find it, or come back to chat whenever you\u2019re ready, react with relief and gratitude - "oh that\u2019s perfect, thank you, I\u2019ll do that" - and the conversation can wrap up there. If you never get that offer, eventually (after your second check-in) say you found it and provide it, a little frazzled from searching.',

// Agent-facing pool: excludes ENGINE_TEST_ONLY scenarios (fictional system mechanics agents
// could mistakenly learn as real Betty behaviour). scenarioById/attempt history/TL reference
// still use the full SCENARIOS list - only pools an agent can browse/randomize into are filtered.
const PILOT_SCENARIOS = SCENARIOS.filter(s => s.readiness !== 'ENGINE_TEST_ONLY');

function scenarioById(id){ return SCENARIOS.find(s=>s.id===id); }

function pickRandomScenario(pool){
  // Bias toward scenarios this agent hasn't attempted yet, so "Randomize" can't be used
  // to quietly land on something they already know the graded answer to.
  const attemptCounts = pool.map(s => ({ s, count: (state.attemptHistory[s.id]||[]).length }));
  const minCount = Math.min(...attemptCounts.map(x=>x.count));
  const leastAttempted = attemptCounts.filter(x=>x.count===minCount).map(x=>x.s);
  return leastAttempted[Math.floor(Math.random()*leastAttempted.length)];
}

function randomizeAndMaybeConfirm(pool){
  if(pool.length===0) return;
  const picked = pickRandomScenario(pool);
  const priorAttempts = (state.attemptHistory[picked.id]||[]).length;
  if(priorAttempts===0){
    startScenario(picked.id);
    return;
  }
  // Already attempted before - don't silently drop them into a repeat. Say so, let them choose.
  const lastAttempt = state.attemptHistory[picked.id][state.attemptHistory[picked.id].length-1];
  const lastScore = computeQAScore(lastAttempt.evaluation.questions);
  const overlay=document.createElement('div');
  overlay.id='randomizeConfirmOverlay';
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:420px;">
    <h2>You\u2019ve done this one before</h2>
    <div style="color:var(--text2);font-size:13px;margin-bottom:6px;"><strong>${escapeHtml(picked.title)}</strong> - ${priorAttempts} prior attempt${priorAttempts===1?'':'s'}, last score: ${lastScore.af?`AF (${lastScore.afDuty})`:lastScore.pct+'%'}</div>
    <div style="color:var(--text3);font-size:12px;margin-bottom:16px;">Every other scenario in this pool has also been tried at least once, so this is the fairest random pick right now - but it\u2019s worth knowing going in, since you\u2019ve already seen how this one gets scored.</div>
    <div style="display:flex;gap:10px;">
      <button id="btnRandomizeAgain">Pick again</button>
      <button id="btnRandomizeStartAnyway" class="primary">Start it anyway</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('btnRandomizeAgain').addEventListener('click', ()=>{ overlay.remove(); randomizeAndMaybeConfirm(pool); });
  document.getElementById('btnRandomizeStartAnyway').addEventListener('click', ()=>{ overlay.remove(); startScenario(picked.id); });
}

function groupBySkill(){
  const groups={};
  SCENARIOS.forEach(s=>{ (groups[s.skill]=groups[s.skill]||[]).push(s); });
  return groups;
}
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  const el=document.getElementById('chatlog');

}

function renderCategoryScenarioList(){
  const topic = state.categoryFilter;
  const order = {Foundation:0, Applied:1, Advanced:2};
  const list = PILOT_SCENARIOS.filter(s=>s.topic===topic).sort((a,b)=> (order[a.difficulty]??1) - (order[b.difficulty]??1));
  const rows = list.map(s=>{
    const initial = s.playerName.charAt(0).toUpperCase();
    return `<div class="category-scenario-card" data-scenario="${s.id}">
      <div class="qavatar" style="background:var(--accent);">${initial}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;font-size:14px;">${escapeHtml(s.title)}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px;">${escapeHtml(s.difficulty)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        ${s.ahtTargetMinutes ? `<span style="font-size:11.5px;color:var(--text3);display:flex;align-items:center;gap:4px;">${icon('clock',12)} ${s.ahtTargetMinutes}m target</span>` : ''}
        <span class="diff-pill diff-${s.difficulty}">${s.difficulty}</span>
      </div>

  }).join('');
  return `<div class="main" style="padding:32px;overflow-y:auto;">
    <button id="btnBackToCategories" class="small" style="margin-bottom:16px;">\u2190 All Topics</button>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">
      <div>
        <h1 style="margin-top:0;">${escapeHtml(topic)}</h1>

function renderMain(){
  if(state.view==='diagnostics' && !state.tlUnlocked) state.view='sim'; // defensive - should be unreachable via the UI anyway
  if(state.view==='diagnostics') return renderDiagnostics();
  if(state.view==='categories') return state.categoryFilter ? renderCategoryScenarioList() : renderCategoriesView();
  if(state.view==='toolkit') return renderCoachingToolkit();
  if(state.view==='history') return renderHistoryPage();
  if(state.view==='reports') return renderReportsPage();
  if(state.view==='feedback') return renderFeedbackPage();
  if(state.view==='challenge-picker') return renderChallengePicker();
  if(state.view==='challenge') return renderChallengeMain();
  if(!state.activeScenario){
    return `<div class="main"><div class="empty" style="margin:auto;">Select a scenario from the left to begin.</div></div>`;
  }
  const s=state.activeScenario;
  let msgs=`<div class="prechat-card">
      <div class="pctitle">Pre-chat form</div>
      <div class="pcq">What is your preferred name?</div><div class="pca">${escapeHtml(s.playerName)}</div>
      <div class="pcq">What brings you here?</div><div class="pca">${escapeHtml(s.title)}</div>
      <div class="pcq">Anything else we should know?</div><div class="pca">${escapeHtml(s.agentBriefing)}</div>
    </div>
    <div class="started-divider"><span>Started - Today, ${new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</span></div>`;
  state.transcript.forEach(m=>{
    if(m.speaker==='system'){ msgs+=`<div class="msg system">${escapeHtml(m.text)}</div>`; return; }
    const who = m.speaker==='player' ? s.playerName : 'You (Agent)';
    msgs += `<div class="msg ${m.speaker}"><div class="who">${escapeHtml(who)}</div>${escapeHtml(m.text)}</div>`;
  });
  const composerDisabled = state.simStatus!=='active' ? 'disabled' : '';
  const hasCompletedEval = state.evaluation && !state.evaluation.loading && !state.evaluation.error;
  return `<div class="main">
    <div class="topbar">
      <div>
        <div class="who">${escapeHtml(s.playerName)}</div>
        <div class="status">${s.title} \u00b7 ${state.simStatus==='active'?'In progress':state.simStatus==='documenting'?'Completing documentation\u2026':state.simStatus==='ended'?'Ended':'Not started'}</div>
      </div>
      <div class="btns">
        <div class="chrome-icons">${icon('flag',16)}${icon('link',16)}${icon('dots',16)}</div>
        ${hasCompletedEval ? `<button id="btnViewAssessment">View Assessment</button>` : ''}
        <button id="btnRestart">Restart</button>
        <button id="btnEnd" class="primary" ${state.simStatus!=='active'?'disabled':''}>End Simulation</button>
      </div>
    </div>
    <div class="chatlog" id="chatlog">${msgs}</div>
    <div class="composer">
      <textarea id="composerInput" placeholder="Type a message, the customer will see this" ${composerDisabled}></textarea>
      <button id="btnSend" class="primary" ${composerDisabled}>Send</button>
    </div>
  </div>`;
}

function renderSide(){
  if(state.view==='challenge') return renderChallengeSide();
  if(state.view==='diagnostics' || !state.activeScenario){
    return `<div class="side">
      <div class="side-icons">${icon('users',17)}${icon('flag',17)}${icon('check',17)}</div>
      <div class="empty" style="padding:40px 16px;">No active scenario.</div>
    </div>`;
  }
  const s=state.activeScenario;

  const tabs={};
  s.caseData.forEach(c=>{ (tabs[c.tab]=tabs[c.tab]||[]).push(c); });
  let caseHtml='';
  Object.keys(tabs).forEach(tab=>{
    caseHtml += `<div class="tab-group"><div class="tab-name">${escapeHtml(tab)}</div>`;
    tabs[tab].forEach(c=>{
      const revealed = !c.gated || state.investigated[c.id];
      if(revealed){
        caseHtml += `<div class="case-card"><div class="clabel">${escapeHtml(c.label)}</div><div class="cvalue">${escapeHtml(c.value)}</div></div>`;
      }else{
        caseHtml += `<div class="case-card"><div class="clabel">${escapeHtml(c.label)}</div><div class="gated-msg">Not yet investigated.</div><button class="small" data-investigate="${c.id}" style="margin-top:6px;">${escapeHtml(c.gateLabel||'Investigate')}</button></div>`;
      }
    });
    caseHtml += `</div>`;
  });

  const initial = s.playerName.charAt(0).toUpperCase();
  const availableCount = s.caseData.filter(c=>c.gated && !state.investigated[c.id]).length;

  return `<div class="side">
    <div class="side-icons">${icon('users',17)}${icon('flag',17)}${icon('check',17)}</div>
    <div class="side-identity">
      <div class="savatar">${initial}</div>
      <div class="sname">${escapeHtml(s.playerName)}</div>
      <div class="ssub">${escapeHtml(s.difficulty)} \u00b7 Simulation</div>
      ${state.ahtMode ? `<div class="aht-live-timer" style="justify-content:center;margin-top:8px;">${icon('clock',13)} Chatting time: <span id="ahtLiveTimer">${state.ahtStartTime ? formatElapsed(Date.now()-state.ahtStartTime) : '0m 00s'}</span></div>${state.ahtLateStart ? `<div style="font-size:10.5px;color:var(--text3);text-align:center;margin-top:2px;">Started late - timing from when AHT Mode was turned on, not chat start</div>` : ''}` : ''}
    </div>

    <div class="side-section">
      <div class="side-section-head"><h2>Scenario</h2>${icon('chevronDown',14)}</div>
      <div class="side-section-body">
        <div class="box">${escapeHtml(s.agentBriefing)}</div>
      </div>
    </div>

    <div class="side-section">
      <div class="side-section-head"><h2>Investigation Panel</h2>${availableCount>0 ? `<span style="background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:2px 8px;">${availableCount} available</span>` : icon('chevronDown',14)}</div>
      <div class="side-section-body">
        ${caseHtml || '<div class="empty">No case data for this scenario.</div>'}
      </div>
    </div>

    <div class="side-section">
      <div class="side-section-head"><h2>Additional info</h2>${icon('chevronDown',14)}</div>
      <div class="side-section-body">
        <div class="info-row"><span class="ilabel">Difficulty</span><span class="ival"><span class="diff-pill diff-${s.difficulty}">${s.difficulty}</span></span></div>
        ${state.activePersonaTrait ? `<div class="info-row"><span class="ilabel">Communication style</span><span class="ival">${escapeHtml(PERSONA_TRAITS[state.activePersonaTrait].label)}</span></div>` : ''}
      </div>
    </div>

    <div class="side-section">
      <div class="side-section-head"><h2>Ending the Simulation</h2>${icon('chevronDown',14)}</div>
      <div class="side-section-body">
        <div class="box">${escapeHtml(s.endConditionsGuide)}</div>
      </div>
    </div>
  </div>`;
}

  });

  const railTLArea=document.getElementById('railTLArea');
  if(railTLArea) railTLArea.addEventListener('click', ()=>{
    if(state.tlUnlocked){ state.view = state.view==='diagnostics'?'sim':'diagnostics'; render(); }

  });
  const btnLockTLArea=document.getElementById('btnLockTLArea');
  if(btnLockTLArea) btnLockTLArea.addEventListener('click', ()=>{ state.tlUnlocked=false; state.view='sim'; render(); });

  const btnAssignScenario=document.getElementById('btnAssignScenario');
  if(btnAssignScenario) btnAssignScenario.addEventListener('click', assignScenarioFromTLForm);

  const railHistory=document.getElementById('railHistory');
  if(railHistory) railHistory.addEventListener('click', ()=>{ state.view='history'; render(); });

  const railAvatar=document.getElementById('railAvatar');
  if(railAvatar) railAvatar.addEventListener('click', e=>{ e.stopPropagation(); renderIdentityCard(); });

  const railHome=document.getElementById('railHome');
  if(railHome) railHome.addEventListener('click', ()=>{
    if(state.ahtTimerInterval){ clearInterval(state.ahtTimerInterval); state.ahtTimerInterval=null; }
    state.activeScenario=null;
    state.categoryFilter=null;
    state.view='categories';
    render();
  });

  const railPractice=document.getElementById('railPractice');
  if(railPractice) railPractice.addEventListener('click', ()=>{
    // Resume an in-progress chat if one exists; otherwise land on the same picker Home shows
    if(state.activeScenario && state.simStatus==='active'){ state.view='sim'; render(); }
    else{ state.categoryFilter=null; state.view='categories'; render(); }
