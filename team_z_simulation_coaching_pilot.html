const FEEDBACK_KEY = 'zteamz_feedbackLocal_v1';

// ---------- TL SCENARIO ASSIGNMENTS ----------
// Shared across the team via the backend store - a TL assigning from their device is now visible to
// an agent on a different device, and vice versa, since both read/write the same server-side file.
// localStorage stays as an offline fallback only, used if the backend request fails for any reason.
const ASSIGNMENTS_KEY = 'zteamz_assignments_v1';

async function loadAssignments(){
  try{
    const response = await fetch(BACKEND_URL + '/api/store');
    if(response.ok){
      const data = await response.json();
      if(Array.isArray(data.assignments)){ state.assignments = data.assignments; return; }
    }
  }catch(err){
    console.error('Loading shared assignments from backend failed, falling back to this device\u2019s local copy:', err);
  }
  try{
    const raw = localStorage.getItem(ASSIGNMENTS_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(Array.isArray(parsed)) state.assignments = parsed; }
  }catch(err){ console.error('Loading assignments failed:', err); }
}
async function saveAssignments(){
  try{ localStorage.setItem(ASSIGNMENTS_KEY, JSON.stringify(state.assignments)); }
  catch(err){ console.error('Saving assignments locally failed:', err); }
  try{
    await fetch(BACKEND_URL + '/api/store/assignments', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(state.assignments)
    });
  }catch(err){
    console.error('Saving assignments to the shared backend failed (saved locally only for now):', err);
  }
}
function namesMatch(a, b){
  return !!a && !!b && a.trim().toLowerCase() === b.trim().toLowerCase();
}
// Returns the existing incomplete assignment for this agent+scenario, if any - used to warn a TL
// before creating an accidental duplicate, per "avoid unintentionally assigning the same scenario
// repeatedly unless a repeat is intentional."
function findPendingAssignment(agentName, scenarioId){
  return state.assignments.find(a => !a.completed && a.scenarioId===scenarioId && namesMatch(a.agentName, agentName));
}
async function createAssignment(agentName, scenarioId){
  state.assignments.push({
    id: 'a'+Date.now()+Math.random().toString(36).slice(2,7),
    agentName: agentName.trim(), scenarioId, assignedAt: Date.now(),
    completed:false, completedAt:null,
  });
  await saveAssignments();
}
// Called right after any attempt is archived (single-chat or Challenge Mode slot) - marks the
// oldest matching pending assignment complete, so a TL sees it move without the agent doing anything extra.
function markAssignmentsCompleted(agentName, scenarioId){
  if(!agentName) return;
  const match = findPendingAssignment(agentName, scenarioId);
  if(match){ match.completed = true; match.completedAt = Date.now(); saveAssignments(); }
}
function pendingAssignmentsFor(agentName){
  if(!agentName) return [];
  return state.assignments.filter(a => !a.completed && namesMatch(a.agentName, agentName));
}

function submitFeedback(){
  const text = (state.feedbackText||'').trim();
  if(!text) return;
  try{
    const raw = localStorage.getItem(FEEDBACK_KEY);
    const list = raw ? JSON.parse(raw) : [];
    list.push({ agentName: state.agentName||'Unnamed', deviceId, text, timestamp: Date.now() });
    localStorage.setItem(FEEDBACK_KEY, JSON.stringify(list));
    state.feedbackText = '';
    state.feedbackJustSubmitted = true;
    state.feedbackSubmitError = null;
  }catch(err){
    console.error('Feedback submit failed:', err);
    state.feedbackSubmitError = err.message;
  }
  render();
}

// ============================================================
// CHALLENGE MODE - multiple concurrent chats, tests prioritization and switching.
// Separate, self-contained system reusing the real scoring engine and the real silence/nudge/leave
// mechanic per chat "slot" - same thresholds, same rules, applied to N independent transcripts.
// Tiers: Rookie(1)/Bronze(2)/Silver(3) as originally specified, plus Gold/Platinum (3, topic-mixed)
// kept from the fuller build - the 5-chat "Chaos" tier has been dropped per instruction.
// ============================================================
const CHALLENGE_TIERS = {
  rookie:   { label:'Rookie',   chatCount:1, composition:'random', desc:'One chat. The baseline - no juggling yet.' },
  bronze:   { label:'Bronze',   chatCount:2, composition:'random', desc:'Two chats at once. Start noticing what neglect costs.' },
  silver:   { label:'Silver',   chatCount:3, composition:'random', desc:'Three chats at once.' },
  gold:     { label:'Gold',     chatCount:3, composition:'gold', desc:'Three chats, deliberately mixed: a deposit issue, a KYC case, and a promo question.' },
  platinum: { label:'Platinum', chatCount:3, composition:'platinum', desc:'Three chats, higher complexity: an RG-relevant case, a withdrawal issue, and a technical/gameplay case.' },
};

const CHALLENGE_COMPOSITION = {
  gold: [
    { label:'Deposit', pick: pool => pool.filter(s=>s.topic==='Payments' && s.id==='noc-5') },
    { label:'KYC', pick: pool => pool.filter(s=>s.topic==='KYC & Verification') },
    { label:'Promo', pick: pool => pool.filter(s=>s.topic==='Promotions') },
  ],
  platinum: [
    { label:'RG', pick: pool => pool.filter(s=>s.topic==='RG') },
    { label:'Withdrawal', pick: pool => pool.filter(s=>s.topic==='Payments' && (s.id==='noc-1'||s.id==='adv-2')) },
    { label:'Technical', pick: pool => pool.filter(s=>s.topic==='Gameplay') },
  ],
};

function pickRandomFromPool(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function composeChallengeScenarios(tier){
  const def = CHALLENGE_TIERS[tier];
  if(!def) return [];
  if(def.composition==='random'){
    const pool = [...PILOT_SCENARIOS];
    const picked = [];
    for(let i=0;i<def.chatCount && pool.length;i++){
      const idx = Math.floor(Math.random()*pool.length);
      picked.push(pool.splice(idx,1)[0]);
    }
    return picked;
  }
  const rules = CHALLENGE_COMPOSITION[def.composition] || [];
  return rules.map(rule => {
    const candidates = rule.pick(PILOT_SCENARIOS);
    return candidates.length ? pickRandomFromPool(candidates) : null;
  }).filter(Boolean);
}

function makeChallengeSlot(scenario){
  return {
    scenario,
    transcript:[],
    turnCounter:0,
    actionLog:[],
    investigated:{},
    docNote:'', docTag:null, docSecondaryTag:null,
    evaluation:null,
    tlOverrides:{},
    status:'active', // 'active' | 'documenting' | 'scoring' | 'ended'
    chatStartedAt: Date.now(),
    personaTrait: pickPersonaTrait(scenario),
    silenceNudgeCount:0,
    silenceActionInFlight:false,
    playerLeftEarly:false, playerLeftReason:null,
    attemptArchived:false,
    endedAt:null,
  };
}

function startChallengeMode(tier){
  if(state.challengeSilenceInterval){ clearInterval(state.challengeSilenceInterval); state.challengeSilenceInterval=null; }
  const scenarios = composeChallengeScenarios(tier);
  state.challenge = {
    active:true,
    tier,
    slots: scenarios.map(makeChallengeSlot),
    activeSlotIndex:0,
    sessionStartedAt: Date.now(),
    switchLog: [{toSlotIndex:0, ts:Date.now()}],
    sessionEvaluation:null,
    sessionEvalLoading:false,
  };
  state.view='challenge';
  render();
  state.challengeSilenceInterval = setInterval(checkChallengeSilence, 5000);
}

function switchChallengeSlot(idx){
  if(!state.challenge.slots[idx]) return;
  state.challenge.activeSlotIndex = idx;
  state.challenge.switchLog.push({toSlotIndex:idx, ts:Date.now()});
  render();
}

async function sendChallengeMessage(slotIndex){
  const slot = state.challenge.slots[slotIndex];
  if(!slot || slot.status!=='active') return;
  const inputEl = document.getElementById('challengeComposerInput');
  const text = inputEl ? inputEl.value.trim() : '';
  if(!text) return;
  slot.turnCounter++;
  slot.transcript.push({speaker:'agent', text, turn:slot.turnCounter, ts:Date.now()});
  slot.silenceNudgeCount = 0;
  slot.silenceActionInFlight = true;
  if(inputEl) inputEl.value='';
  render();
  try{
    const sys = buildPlayerSystemPrompt(slot.scenario, slot.personaTrait);
    const {text:rawReply} = await callClaude(sys, transcriptToApiMessages(slot.transcript), 'default');
    const endedByPlayer = /\[END_CHAT\]\s*$/.test(rawReply);
    const reply = rawReply.replace(/\[END_CHAT\]\s*$/, '').trim();
    slot.turnCounter++;
    slot.transcript.push({speaker:'player', text:reply, turn:slot.turnCounter, ts:Date.now()});
    slot.silenceActionInFlight = false;
    if(endedByPlayer){
      slot.playerLeftEarly = true;
      slot.playerLeftReason = 'conversational';
      slot.transcript.push({speaker:'system', text:'\u2014 Player left the chat \u2014', ts:Date.now()});
      finalizeChallengeSlotChat(slotIndex);
      return;
    }
  }catch(err){
    console.error(err);
    slot.transcript.push({speaker:'system', text:`\u26a0 DEBUG - real error: ${err.message}`, ts:Date.now()});
    slot.silenceActionInFlight = false;
  }
  render();
}

function checkChallengeSilence(){
  if(!state.challenge || !state.challenge.active) return;
  state.challenge.slots.forEach((slot, idx)=>{
    if(slot.status!=='active' || slot.silenceActionInFlight) return;
    let last=null;
    for(let i=slot.transcript.length-1;i>=0;i--){ if(slot.transcript[i].speaker!=='system'){ last=slot.transcript[i]; break; } }
    if(!last) return; // nobody has said anything in this chat yet - nothing to nudge about
    if(last.speaker==='agent'){ slot.silenceNudgeCount=0; return; }
    const since = last.ts;
    if(!since) return;
    const elapsed = Date.now()-since;
    const t = SILENCE_PATIENCE_THRESHOLDS[(slot.scenario && slot.scenario.patience) || (PERSONA_TRAITS[slot.personaTrait] && PERSONA_TRAITS[slot.personaTrait].thresholdTier) || 'neutral'] || SILENCE_PATIENCE_THRESHOLDS.neutral;
    if(slot.silenceNudgeCount===0 && elapsed>=t.nudge1) triggerChallengeNudge(idx,1);
    else if(slot.silenceNudgeCount===1 && elapsed>=t.nudge2) triggerChallengeNudge(idx,2);
    else if(slot.silenceNudgeCount===2 && elapsed>=t.leave) triggerChallengeLeave(idx,'silence');
  });
}

async function triggerChallengeNudge(slotIndex, level){
  const slot = state.challenge.slots[slotIndex];
  if(!slot) return;
  slot.silenceActionInFlight = true;
  try{
    const sys = buildPlayerSystemPrompt(slot.scenario, slot.personaTrait);
    const nudgeInstruction = level===1
      ? `\n\nSPECIAL INSTRUCTION FOR THIS TURN ONLY: the agent has gone quiet for a while now. Send a short, natural check-in message - one sentence, matching your persona's tone.`
      : `\n\nSPECIAL INSTRUCTION FOR THIS TURN ONLY: the agent has STILL been silent since your last check-in. Send a second, more pointed follow-up - noticeably more impatient. One to two sentences.`;
    const apiMsgs = [...transcriptToApiMessages(slot.transcript), {role:'user', content:'(the agent has not responded yet)'}];
    const {text:reply} = await callClaude(sys + nudgeInstruction, apiMsgs, 'quick');
    slot.turnCounter++;
    slot.transcript.push({speaker:'player', text:reply, turn:slot.turnCounter, ts:Date.now()});
    slot.silenceNudgeCount = level;
  }catch(err){
    console.error('Challenge slot nudge failed (non-fatal):', err);
  }
  slot.silenceActionInFlight = false;
  render();
}

async function triggerChallengeLeave(slotIndex, reasonTag){
  const slot = state.challenge.slots[slotIndex];
  if(!slot) return;
  slot.silenceActionInFlight = true;
  try{
    const sys = buildPlayerSystemPrompt(slot.scenario, slot.personaTrait);
    const leaveInstruction = `\n\nSPECIAL INSTRUCTION FOR THIS TURN ONLY: the agent has been silent for a long time now, well past a second check-in with no reply. You've had enough waiting and are leaving the chat. Send a brief final message reflecting your persona and frustration level, then the conversation is over. One to two sentences.`;
    const apiMsgs = [...transcriptToApiMessages(slot.transcript), {role:'user', content:'(the agent has not responded yet)'}];
    const {text:reply} = await callClaude(sys + leaveInstruction, apiMsgs, 'quick');
    slot.turnCounter++;
    slot.transcript.push({speaker:'player', text:reply, turn:slot.turnCounter, ts:Date.now()});
    slot.transcript.push({speaker:'system', text:'\u2014 Player left the chat (no response from agent) \u2014', ts:Date.now()});
  }catch(err){
    console.error('Challenge slot leave-message generation failed, ending anyway:', err);
    slot.transcript.push({speaker:'system', text:'(The player left the chat.)', ts:Date.now()});
  }
  slot.playerLeftEarly = true;
  slot.playerLeftReason = reasonTag;
  slot.silenceActionInFlight = false;
  finalizeChallengeSlotChat(slotIndex);
}

function finalizeChallengeSlotChat(slotIndex){
  const slot = state.challenge.slots[slotIndex];
  if(!slot) return;
  slot.status = 'documenting';
  slot.endedAt = Date.now();
  render();
  renderChallengeDocModal(slotIndex);
}

async function submitChallengeSlotDoc(slotIndex){
  const slot = state.challenge.slots[slotIndex];
  if(!slot) return;
  slot.status = 'scoring'; // distinct from 'ended' - only becomes 'ended' once a real result (or a clean error) is in hand
  slot.evaluation = {loading:true};
  render();
  try{
    const prompt = buildEvalPrompt(slot.scenario, slot.transcript, slot.actionLog, slot.docNote, slot.docTag, slot.docSecondaryTag, slot.chatStartedAt, slot.playerLeftEarly, slot.playerLeftReason);
    const result = await callClaudeJson(prompt, 'complex');
    slot.evaluation = result;
    QA_SCORECARD.questions.forEach(q=>{ const aiQ=result.questions.find(x=>x.id===q.id); slot.tlOverrides[q.id] = {letter:aiQ.letter, afDuty:aiQ.afDuty||null, notes:''}; });
    archiveChallengeSlotAttempt(slot);
  }catch(err){
    console.error(err);
    slot.evaluation = {error:err.message};
  }
  slot.status = 'ended';
  render();
  checkChallengeSessionComplete();
}

function archiveChallengeSlotAttempt(slot){
  if(slot.attemptArchived) return;
  const sid = slot.scenario.id;
  markAssignmentsCompleted(state.agentName, sid);
  state.attemptHistory[sid] = state.attemptHistory[sid] || [];
  const attemptNum = state.attemptHistory[sid].length + 1;
  const record = {
    attemptNum,
    timestamp: Date.now(),
    transcript: slot.transcript,
    actionLog: slot.actionLog,
    evaluation: slot.evaluation,
    tlOverrides: slot.tlOverrides,
    docNote: slot.docNote,
    docSecondaryTag: slot.docSecondaryTag,
    docTag: slot.docTag,
    ahtElapsedMinutes: slot.endedAt && slot.chatStartedAt ? (slot.endedAt-slot.chatStartedAt)/60000 : null,
    ahtLateStart: false,
    ahtTargetMinutes: slot.scenario.ahtTargetMinutes,
    playerLeftEarly: slot.playerLeftEarly,
    playerLeftReason: slot.playerLeftReason,
    challengeTier: state.challenge.tier,
  };
  state.attemptHistory[sid].push(record);
  slot.attemptArchived = true;
  saveAttemptHistoryNow();
  const score = computeQAScore(slot.evaluation.questions);
  pushTeamProgressEntry({
    agentName: state.agentName || 'Unnamed', deviceId: deviceId, scenarioId: sid,
    scenarioTitle: slot.scenario.title, skill: slot.scenario.skill, difficulty: slot.scenario.difficulty,
    timestamp: Date.now(), pct: score.af?0:score.pct, af: score.af, afDuty: score.afDuty, pass: score.pass,
    ahtElapsedMinutes: record.ahtElapsedMinutes, ahtTargetMinutes: slot.scenario.ahtTargetMinutes,
    playerLeftEarly: slot.playerLeftEarly, playerLeftReason: slot.playerLeftReason,
    challengeTier: state.challenge.tier,
    attemptNum, transcript: slot.transcript, actionLog: slot.actionLog, evaluation: slot.evaluation,
    tlOverrides: slot.tlOverrides, docNote: slot.docNote, docTag: slot.docTag, docSecondaryTag: slot.docSecondaryTag,
  });
}

function checkChallengeSessionComplete(){
  if(!state.challenge.slots.every(s=>s.status==='ended')) return;
  if(state.challengeSilenceInterval){ clearInterval(state.challengeSilenceInterval); state.challengeSilenceInterval=null; }
  runChallengeSessionEvaluation();
}

function buildChallengeSessionEvalPrompt(){
  const c = state.challenge;
  const slotsText = c.slots.map((slot,idx)=>{
    if(!slot.evaluation || slot.evaluation.error) return `--- CHAT ${idx+1}: "${slot.scenario.title}" --- (scoring failed for this chat, excluded from session judgment)`;
    const score = computeQAScore(slot.evaluation.questions);
    return `--- CHAT ${idx+1}: "${slot.scenario.title}" (${slot.scenario.topic}) ---
Resolution score: ${score.af?`AF (${score.afDuty})`:score.pct+'%'} ${score.pass?'PASS':'FAIL'}
Started: ${new Date(slot.chatStartedAt).toLocaleTimeString()} | Ended: ${slot.endedAt?new Date(slot.endedAt).toLocaleTimeString():'n/a'}
Player left early: ${slot.playerLeftEarly ? `yes (${slot.playerLeftReason})` : 'no'}
Transcript:
${formatTranscriptForEval(slot.transcript, slot.scenario)}`;
  }).join('\n\n');
  const switchText = c.switchLog.map(e=>`switched to Chat ${e.toSlotIndex+1} at ${new Date(e.ts).toLocaleTimeString()}`).join('; ');
  return `You are a QA evaluator judging ONLY the SESSION-LEVEL multitasking performance of an agent who handled ${c.slots.length} concurrent live chats at once (Challenge Mode, tier: ${CHALLENGE_TIERS[c.tier].label}). Each chat already has its own real scorecard result (shown below) - do NOT re-score individual chat correctness, that is already done and final. Your job is ONLY to judge how well the agent juggled multiple chats at once: prioritization, switching behavior, and keeping players updated.

INDIVIDUAL CHAT RESULTS (for context only - already scored, not yours to re-judge):
${slotsText}

SWITCHING LOG (when the agent moved between chats, in order): ${switchText}

Judge these session-level behaviours, each independently, from the transcripts and switching pattern above:
- prioritization: did the agent seem to work on the right chat first when several needed attention (e.g. a simple one that could close fast, vs. one already escalating)?
- avoidsNeglect: did any chat sit ignored long enough to visibly frustrate the player or cause them to leave, when the agent could reasonably have gotten to it sooner?
- keepsPlayersUpdated: when the agent WAS away from a chat, did they leave the player with any sense of what to expect (implicitly, through timely returns), or did players seem to just wait in the dark?
- overallJuggling: taken as a whole, does this look like competent multi-chat handling, or does it look like one chat got done well while others suffered?

Rate each "good" | "mixed" | "needs-work", with a one-sentence note grounded in the specific chats/timing above - reference chat numbers, not generic praise.

Return ONLY valid JSON, no markdown fences:
{
  "prioritization": {"rating":"...", "note":"..."},
  "avoidsNeglect": {"rating":"...", "note":"..."},
  "keepsPlayersUpdated": {"rating":"...", "note":"..."},
  "overallJuggling": {"rating":"...", "note":"..."},
  "summary": "2-3 sentence summary of the session as a whole"
}`;
}

async function runChallengeSessionEvaluation(){
  state.challenge.sessionEvalLoading = true;
  render();
  try{
    const prompt = buildChallengeSessionEvalPrompt();
    state.challenge.sessionEvaluation = await callClaudeJson(prompt, 'complex');
  }catch(err){
    console.error(err);
    state.challenge.sessionEvaluation = {error: err.message};
  }
  state.challenge.sessionEvalLoading = false;
  render();
}

function renderChallengeMain(){
  const c = state.challenge;
  if(!c || !c.active) return `<div class="main"><div class="empty" style="margin:auto;">No active Challenge Mode session.</div></div>`;
  if(c.slots.every(s=>s.status==='ended')) return renderChallengeSessionReport();

  const tabs = c.slots.map((slot, idx)=>{
    const isActive = idx===c.activeSlotIndex;
    let waitBadge='';
    if(slot.status==='active'){
      let last=null;
      for(let i=slot.transcript.length-1;i>=0;i--){ if(slot.transcript[i].speaker!=='system'){ last=slot.transcript[i]; break; } }
      if(last && last.speaker==='player'){
        const mins = Math.floor((Date.now()-last.ts)/60000);
        if(mins>=1) waitBadge = `<span style="font-size:10px;color:var(--warn);margin-left:6px;">${mins}m</span>`;
      }
    }
    const statusDot = slot.status==='ended' ? 'var(--ok)' : (slot.status==='documenting'||slot.status==='scoring' ? 'var(--text3)' : 'var(--accent)');
    return `<div class="challenge-tab ${isActive?'active':''}" data-challenge-tab="${idx}" style="cursor:pointer;display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:2px solid ${isActive?'var(--accent)':'transparent'};white-space:nowrap;">
      <span style="width:7px;height:7px;border-radius:50%;background:${statusDot};display:inline-block;flex-shrink:0;"></span>
      <span style="font-size:12.5px;font-weight:${isActive?700:500};">${escapeHtml(slot.scenario.title)}</span>
      ${waitBadge}
    </div>`;
  }).join('');

  const activeSlot = c.slots[c.activeSlotIndex];
  const composerDisabled = activeSlot.status!=='active' ? 'disabled' : '';
  const msgs = activeSlot.transcript.map(m=>{
    if(m.speaker==='system') return `<div class="msg system">${escapeHtml(m.text)}</div>`;
    const who = m.speaker==='player' ? activeSlot.scenario.playerName : 'You (Agent)';
    return `<div class="msg ${m.speaker}"><div class="who">${escapeHtml(who)}</div>${escapeHtml(m.text)}</div>`;
  }).join('');

  return `<div class="main">
    <div style="display:flex;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;">${tabs}</div>
    <div class="topbar">
      <div>
        <div class="who">${escapeHtml(activeSlot.scenario.playerName)}</div>
        <div class="status">${escapeHtml(activeSlot.scenario.title)} \u00b7 ${activeSlot.status==='active'?'In progress':(activeSlot.status==='documenting'||activeSlot.status==='scoring')?'Completing documentation\u2026':'Ended'}</div>
      </div>
      <div class="btns">
        <button id="btnEndChallengeSlot" class="primary" ${activeSlot.status!=='active'?'disabled':''}>End This Chat</button>
      </div>
    </div>
    <div class="chatlog" id="challengeChatlog">${msgs}</div>
    <div class="composer">
      <textarea id="challengeComposerInput" placeholder="Type a message" ${composerDisabled}></textarea>
      <button id="btnSendChallenge" class="primary" ${composerDisabled}>Send</button>
    </div>
  </div>`;
}

function renderChallengeSide(){
  const c = state.challenge;
  if(!c || !c.active) return `<div class="side"><div class="empty" style="padding:40px 16px;">No active session.</div></div>`;
  if(c.slots.every(s=>s.status==='ended')) return `<div class="side"><div class="empty" style="padding:40px 16px;">Session complete - see the report.</div></div>`;
  const slot = c.slots[c.activeSlotIndex];
  const s = slot.scenario;
  const tabs={};
  s.caseData.forEach(cd=>{ (tabs[cd.tab]=tabs[cd.tab]||[]).push(cd); });
  let caseHtml='';
  Object.keys(tabs).forEach(tab=>{
    caseHtml += `<div class="tab-group"><div class="tab-name">${escapeHtml(tab)}</div>`;
    tabs[tab].forEach(cd=>{
      const revealed = !cd.gated || slot.investigated[cd.id];
      if(revealed){
        caseHtml += `<div class="case-card"><div class="clabel">${escapeHtml(cd.label)}</div><div class="cvalue">${escapeHtml(cd.value)}</div></div>`;
      }else{
        caseHtml += `<div class="case-card"><div class="clabel">${escapeHtml(cd.label)}</div><div class="gated-msg">Not yet investigated.</div><button class="small" data-challenge-investigate="${cd.id}" style="margin-top:6px;">${escapeHtml(cd.gateLabel||'Investigate')}</button></div>`;
      }
    });
    caseHtml += `</div>`;
  });
  return `<div class="side">
    <div class="side-identity">
      <div class="savatar">${s.playerName.charAt(0).toUpperCase()}</div>
      <div class="sname">${escapeHtml(s.playerName)}</div>
      <div class="ssub">${escapeHtml(s.skill)}</div>
    </div>
    <div class="side-section">
      <div class="side-section-head"><h2>Scenario</h2></div>
      <div class="side-section-body"><div class="box">${escapeHtml(s.agentBriefing)}</div></div>
    </div>
    <div class="side-section">
      <div class="side-section-head"><h2>Investigation Panel</h2></div>
      <div class="side-section-body">${caseHtml || '<div class="empty">No case data.</div>'}</div>
    </div>
  </div>`;
}

    <div class="box title" style="margin:16px 0 6px;">Tag</div>

function renderChallengeSessionReport(){
  const c = state.challenge;
  const rows = c.slots.map((slot, idx)=>{
    if(!slot.evaluation || slot.evaluation.error){
      return `<div class="box" style="margin-bottom:8px;border-color:var(--bad);">
        <strong>${escapeHtml(slot.scenario.title)}</strong>
        <div style="color:var(--bad);font-size:12px;margin-top:4px;">Scoring failed for this chat${slot.evaluation && slot.evaluation.error ? ': '+escapeHtml(slot.evaluation.error) : ''}</div>
      </div>`;
    }
    const sc = computeQAScore(slot.evaluation.questions);
    return `<div class="box" style="margin-bottom:8px;cursor:pointer;" data-view-challenge-slot="${idx}">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>${escapeHtml(slot.scenario.title)}</strong>
        <span style="color:${sc.pass?'var(--ok)':'var(--bad)'};font-weight:700;">${sc.af?`AF (${sc.afDuty})`:sc.pct+'%'} \u00b7 ${sc.pass?'PASS':'FAIL'}</span>
      </div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px;">${slot.playerLeftEarly ? 'Player left early ('+escapeHtml(slot.playerLeftReason)+')' : 'Closed by agent'}</div>
    </div>`;
  }).join('');

  let sessionBox = '';
  if(c.sessionEvalLoading){
    sessionBox = `<div class="box"><div class="empty">Scoring the session as a whole\u2026</div></div>`;
  }else if(c.sessionEvaluation && c.sessionEvaluation.error){
    sessionBox = `<div class="box" style="border-color:var(--bad);color:var(--bad);">Session evaluation failed: ${escapeHtml(c.sessionEvaluation.error)}</div>`;
  }else if(c.sessionEvaluation){
    const se = c.sessionEvaluation;
    const labels = {prioritization:'Prioritization', avoidsNeglect:'Avoided neglecting a chat', keepsPlayersUpdated:'Kept players updated', overallJuggling:'Overall juggling'};
    const sessionRows = Object.keys(labels).map(key=>{
      const sig = se[key]; if(!sig) return '';
      const color = COACHING_RATING_COLOR[sig.rating] || 'var(--text3)';
      return `<div class="info-row"><span class="ilabel">${labels[key]}<br><span style="font-size:11px;color:var(--text3);">${escapeHtml(sig.note||'')}</span></span><span class="ival" style="color:${color};font-weight:700;">${escapeHtml(COACHING_RATING_LABEL[sig.rating]||sig.rating)}</span></div>`;
    }).join('');
    sessionBox = `<div class="box"><div style="font-weight:700;margin-bottom:8px;">Session Performance</div><div style="font-size:13px;color:var(--text2);margin-bottom:10px;">${escapeHtml(se.summary||'')}</div>${sessionRows}</div>`;
  }

  return `<div class="main" style="padding:32px;overflow-y:auto;">
    <h1 style="margin-top:0;">Session Report - ${escapeHtml(CHALLENGE_TIERS[c.tier].label)}</h1>
    <div style="color:var(--text2);font-size:13px;margin-bottom:20px;">Each chat is scored on the real scorecard, same as always. The session performance below is separate - it judges the juggling, not any individual chat\u2019s correctness.</div>
    <div style="max-width:640px;">${rows}</div>
    <div style="max-width:640px;margin-top:16px;">${sessionBox}</div>
    <div style="margin-top:20px;"><button id="btnExitChallenge">Back to Training Modes</button></div>
  </div>`;
}

function renderCoachingSignalsBox(coachingSignals){

function scoreHeaderHtml(ev, tlOverrides, ahtElapsedMinutes, ahtTargetMinutes, ahtLateStart){
  const aiScore = computeQAScore(ev.questions);
  const tlLetters = QA_SCORECARD.questions.map(q=>({id:q.id, letter:tlOverrides[q.id].letter, afDuty:tlOverrides[q.id].afDuty}));
  const tlScore = computeQAScore(tlLetters);
  const resolvedCorrectly = tlScore.pass && !tlScore.af;
  return `<div class="box" style="text-align:center;padding:18px;">
      <div class="score-badge" style="color:${aiScore.pass?'var(--ok)':'var(--bad)'};">${aiScore.af?'0%':aiScore.pct+'%'} ${aiScore.pass?'\u{1F44D}':'\u{1F44E}'}</div>
      <div class="score-label">${aiScore.af?`AF - ${escapeHtml(aiScore.afDuty)} - FAIL`:(aiScore.pass?'PASS':'FAIL')} \u00b7 AI score (${aiScore.totalPts}/20 pts) \u00b7 pass line 85%</div>
      ${(tlScore.pct!==aiScore.pct || tlScore.af!==aiScore.af) ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
        <div class="score-badge" style="font-size:24px;color:${tlScore.pass?'var(--ok)':'var(--bad)'};">${tlScore.af?'0%':tlScore.pct+'%'} ${tlScore.pass?'\u{1F44D}':'\u{1F44E}'}</div>
        <div class="score-label">${tlScore.af?`AF - ${escapeHtml(tlScore.afDuty)} - FAIL`:(tlScore.pass?'PASS':'FAIL')} \u00b7 TL-validated score</div>
      </div>` : ''}
    </div>
    ${renderAHTBox(ahtElapsedMinutes, ahtTargetMinutes, resolvedCorrectly, ahtLateStart)}`;
}

          ? `<button id="btnBackToHistoryList" data-hist-scenario="${s.id}" data-from-team-progress="${!!state.historicalView.fromTeamProgress}">\u2190 Back</button><button id="closeEvalModal">Close</button>`
          : `<button id="btnBackToCurrent">\u2190 Back to current attempt</button>`}
      </div>
    </div>`;
  }

  const s=state.activeScenario;
  const ev=state.evaluation;
  if(ev.loading){
    return `<div class="modal"><h2>Scoring transcript...</h2><div class="empty">Evaluating against Betty's real QA Chat Scorecard.</div></div>`;
  }
  if(ev.error){
    return `<div class="modal"><h2>Evaluation failed - real error</h2>
      <div class="box" style="font-family:monospace;font-size:12.5px;">${escapeHtml(ev.error)}</div>
      <div style="color:var(--text3);font-size:12.5px;margin-top:10px;">Your chat and documentation are still saved in memory - retry doesn\u2019t require redoing the conversation.</div>
      <div style="margin-top:16px;display:flex;gap:10px;">
        <button id="btnRetryEvaluation" class="primary">Retry Scoring</button>
        <button id="closeEvalModal">Close</button>
      </div></div>`;
  }

  const allAttempts = state.attemptHistory[s.id] || [];
  // The just-completed attempt is now archived as the LAST entry (saved immediately on completion).
  // "Previous Attempts" means everything before that one, not the whole array.
  const attemptNum = allAttempts.length || 1;
  const priorAttempts = allAttempts.slice(0, -1);
  const lastAttempt = priorAttempts[priorAttempts.length-1];

  let comparisonHtml = '';
  if(lastAttempt){
    const rows = QA_SCORECARD.questions.map(qDef=>{
      const prevLetter = lastAttempt.evaluation.questions.find(x=>x.id===qDef.id).letter;
      const curLetter = ev.questions.find(x=>x.id===qDef.id).letter;
      const rank = {AF:-1, F:0, D:1, C:2, B:3, A:4};
      const improved = rank[curLetter] > rank[prevLetter];
      const worse = rank[curLetter] < rank[prevLetter];
      const color = improved ? 'var(--ok)' : worse ? 'var(--bad)' : 'var(--text3)';
      return `<div class="info-row"><span class="ilabel">${escapeHtml(qDef.label)}</span><span class="ival" style="color:${color};">${escapeHtml(prevLetter)} \u2192 ${escapeHtml(curLetter)}</span></div>`;
    }).join('');
    comparisonHtml = `<div class="box"><div class="box title" style="margin-bottom:6px;">Progress since Attempt ${lastAttempt.attemptNum}</div>${rows}</div>`;
  }

  let historyHtml = '';
  if(priorAttempts.length > 0){
    const listItems = [...priorAttempts].reverse().map((att, revIdx)=>{
      const idx = priorAttempts.length - 1 - revIdx; // original index for lookup
      const sc = computeQAScore(att.evaluation.questions);
      return `<div class="box" style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong>Attempt ${att.attemptNum}</strong>
          <span style="color:${sc.pass?'var(--ok)':'var(--bad)'};font-weight:700;">${sc.af?`AF (${sc.afDuty})`:sc.pct+'%'} \u00b7 ${sc.pass?'PASS \u{1F44D}':'FAIL \u{1F44E}'}</span>
        </div>
        <div style="color:var(--text3);font-size:11.5px;margin:4px 0 8px;">${new Date(att.timestamp).toLocaleString()}</div>
        <div style="font-size:12.5px;color:var(--text2);">${escapeHtml(att.evaluation.overallSummary.slice(0,180))}${att.evaluation.overallSummary.length>180?'\u2026':''}</div>
        <button class="small" data-view-attempt="${idx}" data-hist-scenario="${s.id}" style="margin-top:8px;">View full transcript & assessment</button>
      </div>`;
    }).join('');
    historyHtml = `<div class="diag-section">
      <button id="btnToggleHistory" style="width:100%;text-align:left;">${state.historyExpanded?'\u25be':'\u25b8'} Previous Attempts (${priorAttempts.length})</button>
      ${state.historyExpanded ? `<div style="margin-top:12px;">${listItems}</div>` : ''}
    </div>`;
  }

  return `<div class="modal">
    <h2>Assessment Report - Attempt ${attemptNum}</h2>
    <div style="color:var(--text2);font-size:13px;margin-bottom:14px;">${escapeHtml(s.title)} - scored against Betty's real QA Chat Scorecard</div>
    ${kbBannerFor(s)}
    ${scoreHeaderHtml(ev, state.tlOverrides, state.ahtElapsedMinutes, s.ahtTargetMinutes, state.ahtLateStart)}
    ${renderEfficiencyNarrativeBox(ev)}
    ${renderCoachingSignalsBox(ev.coachingSignals)}
    <div class="box">${escapeHtml(ev.overallSummary)}</div>
    ${comparisonHtml}
    ${scorecardRowsHtml(ev, state.tlOverrides, false)}
    ${!state.resultsCopied ? `<div class="box" id="unsavedWarningBox" style="border-color:var(--warn);color:var(--warn);font-weight:600;text-align:center;">\u26a0 This attempt is saved in your Attempt History, but hasn't been copied to your coaching notes/hub yet - copy it before closing if you need it outside this tool.</div>` : ''}
    <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">
      <button id="closeEvalModal">Close</button>
      <button id="btnCopyResults" class="primary">Copy transcript + evaluation</button>
    </div>
    <div id="resultsTextareaBox" style="display:${state.pendingResultsText?'block':'none'};margin-top:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-size:12.5px;color:var(--text3);">Full results - select and copy manually if the button above didn't copy automatically:</span>
        <button id="btnSelectAllResults" class="small">Select All</button>
      </div>
      <textarea id="resultsTextarea" readonly style="width:100%;min-height:160px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-family:monospace;font-size:11.5px;resize:vertical;">${escapeHtml(state.pendingResultsText||'')}</textarea>
      <div id="copyStatusMsg" style="font-size:12px;color:var(--text3);margin-top:6px;"></div>
    </div>
    ${historyHtml}
  </div>`;
}

function buildResultsText(){
  const s=state.activeScenario;
  const ev=state.evaluation;
  const aiScore = computeQAScore(ev.questions);
  const tlScore = currentOverrideScore();
  const attemptNum = (state.attemptHistory[s.id]||[]).length || 1;
  let out = `TEAM Z COACHING PILOT - SIMULATION RESULT (Betty Real QA Chat Scorecard)\n`;
  out += `Scenario: ${s.title} (${s.skill}, ${s.difficulty})\n`;
  out += `Attempt: ${attemptNum}\n`;
  out += `AI Score: ${aiScore.af?`AF (${aiScore.afDuty}) \u2192 0%`:aiScore.pct+'%'} - ${aiScore.pass?'PASS \u{1F44D}':'FAIL \u{1F44E}'}\n`;
  out += `TL-Validated Score: ${tlScore.af?`AF (${tlScore.afDuty}) \u2192 0%`:tlScore.pct+'%'} - ${tlScore.pass?'PASS \u{1F44D}':'FAIL \u{1F44E}'}\n`;
  if(state.ahtElapsedMinutes!==null && s.ahtTargetMinutes){
    out += `Handling Time: ${formatElapsed(state.ahtElapsedMinutes*60000)} (target: ${s.ahtTargetMinutes} min)\n`;
  }
  out += `\n`;
  out += `SUMMARY: ${ev.overallSummary}\n\n`;
  out += `SCORECARD (AI \u2192 TL-validated):\n`;
  QA_SCORECARD.questions.forEach(qDef=>{
    const aiQ = ev.questions.find(x=>x.id===qDef.id);
    const tl = state.tlOverrides[qDef.id];
    out += `- ${qDef.label} (${qDef.weightPct}%): AI="${aiQ.letter}${aiQ.afDuty?' ('+aiQ.afDuty+')':''}" \u2192 TL="${tl.letter}${tl.afDuty?' ('+tl.afDuty+')':''}"${tl.notes?` | Note: ${tl.notes}`:''}\n  Citation: ${aiQ.citation}\n`;
  });
  out += `\nDOCUMENTATION SUBMITTED:\nNote: ${state.docNote||'(none)'}\nPrimary tag: ${state.docTag||'(none)'}${state.docSecondaryTag && state.docSecondaryTag!=='None' ? `\nSecondary RG flag: ${state.docSecondaryTag}` : ''}\n`;
  out += `\nTRANSCRIPT:\n${formatTranscriptForEval(state.transcript, s)}\n`;
  return out;
}

function copyResultsToClipboard(){
  const out = buildResultsText();
  state.pendingResultsText = out;

  // Try the clipboard API as a bonus - it's frequently blocked inside sandboxed artifact iframes,
  // so this must never be the only path. The visible textarea below is the reliable fallback.
  let clipboardWorked = false;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(out).then(()=>{
      clipboardWorked = true;
      state.resultsCopied = true;
      hideUnsavedWarning();
      const statusEl = document.getElementById('copyStatusMsg');
      if(statusEl) statusEl.textContent = '\u2713 Copied to clipboard automatically. You can also select the text below manually if needed.';
    }).catch(()=>{
      const statusEl = document.getElementById('copyStatusMsg');
      if(statusEl) statusEl.textContent = 'Clipboard access isn\u2019t available in this view - select the text below and copy manually (Ctrl/Cmd+C).';
    });
  }

  showResultsTextarea();
}

function showResultsTextarea(){
  const box = document.getElementById('resultsTextareaBox');
  if(box) box.style.display = 'block';
  const ta = document.getElementById('resultsTextarea');
  if(ta) ta.value = state.pendingResultsText || buildResultsText();
}

function hideUnsavedWarning(){
  const w = document.getElementById('unsavedWarningBox');
  if(w) w.style.display = 'none';
}

function selectAllResultsText(){
  const ta = document.getElementById('resultsTextarea');
  if(!ta) return;
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, ta.value.length); // mobile Safari fallback
  state.resultsCopied = true;
  hideUnsavedWarning();
  const statusEl = document.getElementById('copyStatusMsg');
  if(statusEl) statusEl.textContent = 'Text selected - press Ctrl/Cmd+C to copy.';
}

function renderAssignmentsList(){
  if(state.assignments.length===0) return `<div class="empty" style="padding:16px 0;">No scenarios assigned yet.</div>`;

      return `<div class="info-row">

async function assignScenarioFromTLForm(){
  const nameInput = document.getElementById('assignAgentName');
  const select = document.getElementById('assignScenarioSelect');

  const agentName = nameInput.value.trim();
  const scenarioId = select.value;

  const existing = findPendingAssignment(agentName, scenarioId);
  if(existing){
    warningEl.style.display = 'block';
    const scenario = scenarioById(scenarioId);
    warningEl.innerHTML = `<div class="box" style="border-color:var(--warn);">
      <div style="color:var(--warn);font-size:13px;margin-bottom:8px;">${escapeHtml(agentName)} already has a pending, uncompleted assignment for "${escapeHtml(scenario.title)}" from ${new Date(existing.assignedAt).toLocaleDateString()}. Assign it again anyway?</div>

      <button id="btnCancelDuplicateAssign" class="small">Cancel</button>
    </div>`;
    document.getElementById('btnConfirmDuplicateAssign').addEventListener('click', async ()=>{
      await createAssignment(agentName, scenarioId); nameInput.value=''; warningEl.style.display='none'; state.view='diagnostics'; render();

async function runDiagnostic1(){
  const resultEl=document.getElementById('diag1Result');
  resultEl.innerHTML = `<div class="diag-result">Running strong transcript...</div>`;
  const scenario = scenarioById('noc-1');
  try{
    const strongEval = await evaluateFixedTranscript(scenario, DIAG1_STRONG_TRANSCRIPT);
    resultEl.innerHTML = `<div class="diag-result">Strong run scored. Running weak transcript...</div>`;
    const weakEval = await evaluateFixedTranscript(scenario, DIAG1_WEAK_TRANSCRIPT);

    const strongScore = computeQAScore(strongEval.questions);
    const weakScore = computeQAScore(weakEval.questions);
    const pass = strongScore.pass && !weakScore.pass && (strongScore.pct > weakScore.pct);

    const strongQ1 = strongEval.questions.find(q=>q.id==='q1');
    const weakQ1 = weakEval.questions.find(q=>q.id==='q1');

    resultEl.innerHTML = `<div class="diag-result">
      <div class="${pass?'diag-pass':'diag-fail'}">${pass?'\u2713 PASS':'\u2717 FAIL'}</div>
      Strong run: ${strongScore.af?'AF \u2192 0%':strongScore.pct+'%'} (${strongScore.pass?'PASS':'FAIL'}) - Q1: ${escapeHtml(strongQ1.letter)}<br>
      Weak run: ${weakScore.af?'AF \u2192 0%':weakScore.pct+'%'} (${weakScore.pass?'PASS':'FAIL'}) - Q1: ${escapeHtml(weakQ1.letter)} - "${escapeHtml(weakQ1.citation)}"<br>
      <div style="margin-top:8px;color:var(--text3);">Pass condition: strong run passes (\u226585%), weak run fails, and strong scores strictly higher. Real scorecard expectation: confirming "no issue" without checking Auto-Deposit is misinformation with consequence - likely a D or F on Q1, not necessarily AF (this isn't one of the 4 AF duties).</div>
    </div>`;
  }catch(err){
    resultEl.innerHTML = `<div class="diag-result diag-fail">\u2717 ERROR: ${escapeHtml(err.message)}</div>`;
  }
}

async function runDiagnostic2(){

  const transcript = [

    // turn 3: agent asks something unrelated, to add distance before the misstatement
    transcript.push({speaker:'agent', turn:3, text:"Got it, thanks. And just to check - was this your only withdrawal request this week?"});
    let apiMsgs = transcriptToApiMessages(transcript);
    let {text:reply1} = await callClaude(DIAG2_GENERIC_PERSONA, apiMsgs, 'default');
    transcript.push({speaker:'player', turn:4, text:reply1});

    // turn 5: agent misstates the amount
    transcript.push({speaker:'agent', turn:5, text:`Just to make sure I have this right - your $${DIAG2_WRONG_VALUE} withdrawal submitted Tuesday, that's correct?`});
    apiMsgs = transcriptToApiMessages(transcript);
    let {text:reply2} = await callClaude(DIAG2_GENERIC_PERSONA, apiMsgs, 'default');
    transcript.push({speaker:'player', turn:6, text:reply2});

    const playerReplies = transcript.filter(m=>m.speaker==='player').map(m=>m.text);
    const uniqueReplies = new Set(playerReplies);
    const noVerbatimRepeats = uniqueReplies.size === playerReplies.length;

    // PRIMARY deterministic check: does the correction reply reference the real value and not silently accept the wrong one
    const correctionReply = reply2;
    const containsCorrectValue = correctionReply.includes('187');
    const deterministicPass = containsCorrectValue;

    // SECONDARY qualitative AI check
    const checkPrompt = `A customer earlier said their withdrawal was "$187.42, submitted around midday Tuesday, via Interac." Later, they were asked to confirm a withdrawal of "$210, submitted Tuesday." Here is their reply: "${correctionReply}"\n\nDoes this reply correctly push back on or correct the wrong $210 figure, rather than silently accepting it? Answer with ONLY "YES" or "NO" followed by a one-sentence reason.`;
    const {text:memCheck} = await callClaude(null, [{role:'user', content:checkPrompt}], 'quick');
    const qualitativeConfirmed = memCheck.trim().toUpperCase().startsWith('YES');

    const pass = deterministicPass && noVerbatimRepeats;
    resultEl.innerHTML = `<div class="diag-result">
      <div class="${pass?'diag-pass':'diag-fail'}">${pass?'\u2713 PASS':'\u2717 FAIL'}</div>
      <strong>Deterministic check</strong> (primary): reply contains the correct value "187": ${deterministicPass}<br>
      <strong>Qualitative check</strong> (secondary, AI-judged): ${qualitativeConfirmed} - "${escapeHtml(memCheck.trim())}"<br>
      No verbatim repeated replies: ${noVerbatimRepeats} (${uniqueReplies.size}/${playerReplies.length} unique)<br>
      <div style="margin-top:8px;color:var(--text3);">Transcript:</div>
      ${transcript.map(m=>`<div style="margin-top:4px;"><strong>${m.speaker==='agent'?'Agent':'Player'}:</strong> ${escapeHtml(m.text)}</div>`).join('')}
    </div>`;
  }catch(err){
    resultEl.innerHTML = `<div class="diag-result diag-fail">\u2717 ERROR: ${escapeHtml(err.message)}</div>`;
  }
}

// ---------- DIAGNOSTIC 3: RG AF vs D boundary ----------
const DIAG3_MISSED_TRANSCRIPT = [
  {speaker:'agent', turn:1, text:"Hi! Let me check on your Daily Wheel spin for you."},
  {speaker:'player', turn:2, text:"Thanks. It's not showing as claimed today, weird."},

  {speaker:'player', turn:6, text:"Nope that's it, thanks!"},
];

const DIAG3_COMPLETE_TRANSCRIPT = [
  {speaker:'agent', turn:1, text:"Hi! Let me check on your Daily Wheel spin for you."},
  {speaker:'player', turn:2, text:"Thanks. It's not showing as claimed today, weird."},
  {speaker:'agent', turn:3, text:"I can see it hasn't been claimed yet - the claim button should be available, try refreshing the page. Also, just picking up on something you might not have meant seriously - you mentioned trying to win back money from earlier. Can you tell me a bit more about that?"},

];

const DIAG3_INCOMPLETE_TRANSCRIPT = [
  {speaker:'agent', turn:1, text:"Hi! Let me check on your Daily Wheel spin for you."},
  {speaker:'player', turn:2, text:"Thanks. It's not showing as claimed today, weird."},
  {speaker:'agent', turn:3, text:"I can see it hasn't been claimed yet - try refreshing the page. Before I forget - you mentioned trying to win back money from earlier. Is that something that's been on your mind?"},
  {speaker:'player', turn:4, text:"Yeah, a bit, I guess. I've been trying to chase it back for a little while now."},
  {speaker:'agent', turn:5, text:"I hear you, that sounds stressful. Just try to take it easy today and maybe set yourself a limit, ok?"},

];

async function runDiagnostic3(){
  const resultEl=document.getElementById('diag3Result');
  resultEl.innerHTML = `<div class="diag-result">Running missed-trigger transcript...</div>`;
  const scenario = scenarioById('rg-1');
  try{
    const missedEval = await evaluateFixedTranscript(scenario, DIAG3_MISSED_TRANSCRIPT);
    resultEl.innerHTML = `<div class="diag-result">Missed run scored. Running fully-executed transcript...</div>`;
    const completeEval = await evaluateFixedTranscript(scenario, DIAG3_COMPLETE_TRANSCRIPT);
    resultEl.innerHTML = `<div class="diag-result">Complete run scored. Running incompletely-executed transcript...</div>`;
    const incompleteEval = await evaluateFixedTranscript(scenario, DIAG3_INCOMPLETE_TRANSCRIPT);

    const missedScore = computeQAScore(missedEval.questions);
    const completeScore = computeQAScore(completeEval.questions);
    const incompleteScore = computeQAScore(incompleteEval.questions);

    const missedQ1 = missedEval.questions.find(q=>q.id==='q1');
    const completeQ1 = completeEval.questions.find(q=>q.id==='q1');
    const incompleteQ1 = incompleteEval.questions.find(q=>q.id==='q1');

    const missedCorrect = missedScore.af && missedScore.afDuty && missedScore.afDuty.toLowerCase().includes('responsible gambling');
    const completeCorrect = completeScore.pass && !completeScore.af;
    const incompleteCorrect = !incompleteScore.af && incompleteQ1.letter==='D' && !incompleteScore.pass;

    const pass = missedCorrect && completeCorrect && incompleteCorrect;

    resultEl.innerHTML = `<div class="diag-result">
      <div class="${pass?'diag-pass':'diag-fail'}">${pass?'\u2713 PASS':'\u2717 FAIL'}</div>
      <strong>(a) Missed entirely:</strong> ${missedScore.af?`AF - ${escapeHtml(missedScore.afDuty)}`:missedScore.pct+'%'} ${missedCorrect?'\u2713':'\u2717 expected AF/Responsible Gambling'} - Q1: ${escapeHtml(missedQ1.letter)} - "${escapeHtml(missedQ1.citation)}"<br>
      <strong>(b) Fully executed:</strong> ${completeScore.af?`AF - ${escapeHtml(completeScore.afDuty)}`:completeScore.pct+'%'} (${completeScore.pass?'PASS':'FAIL'}) ${completeCorrect?'\u2713':'\u2717 expected PASS, no AF'} - Q1: ${escapeHtml(completeQ1.letter)}<br>
      <strong>(c) Caught but incomplete:</strong> ${incompleteScore.af?`AF - ${escapeHtml(incompleteScore.afDuty)}`:incompleteScore.pct+'%'} (${incompleteScore.pass?'PASS':'FAIL'}) ${incompleteCorrect?'\u2713':'\u2717 expected exactly D on Q1, NOT F, NOT AF'} - Q1: ${escapeHtml(incompleteQ1.letter)} - "${escapeHtml(incompleteQ1.citation)}"<br>
      ${incompleteQ1.recognitionCheck ? `<span style="color:var(--warn);">Recognition check: ${escapeHtml(incompleteQ1.recognitionCheck)}</span><br>` : ''}
      <div style="margin-top:8px;color:var(--text3);">A full miss zeroes the chat (AF), while genuine recognition followed by incomplete execution should score D on Q1. If case (c) returns F or AF, the evaluator has not applied the intended boundary correctly and the diagnostic should fail.</div>
    </div>`;
  }catch(err){
    resultEl.innerHTML = `<div class="diag-result diag-fail">\u2717 ERROR: ${escapeHtml(err.message)}</div>`;
  }
}

// ---------- INIT ----------
function hasUncopiedResults(){
  // Attempts ARE saved to persistent storage automatically now. This just tracks whether
  // the result has been copied out to external coaching documentation (hub, notes) yet.
  return !!(state.evaluation && !state.evaluation.loading && !state.evaluation.error && !state.resultsCopied);
}
window.addEventListener('beforeunload', function(e){
  if(hasUncopiedResults()){
    e.preventDefault();
    e.returnValue = ''; // required for the native browser prompt to appear
    return '';
  }
});

function renderIdentityCard(){
  let existing=document.getElementById('identityCardOverlay');
  if(existing){ existing.remove(); return; }
  const railAvatar = document.getElementById('railAvatar');
  const rect = railAvatar ? railAvatar.getBoundingClientRect() : {left:60, top:window.innerHeight-80};
  const overlay=document.createElement('div');
  overlay.id='identityCardOverlay';
  overlay.style.cssText = `position:fixed;left:${rect.right+10}px;bottom:${window.innerHeight-rect.bottom}px;z-index:60;`;
  overlay.innerHTML = `<div class="box" style="width:240px;padding:14px;display:flex;align-items:center;gap:10px;">
    <div class="rail-avatar" style="margin-top:0;">${state.agentName ? state.agentName.trim().charAt(0).toUpperCase() : '?'}</div>
    <div style="flex:1;min-width:0;">
      <div style="font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(state.agentName||'No name set')}</div>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">
        <button class="small" id="btnChangeName">Change name</button>
        <button class="small" id="btnClearMyData" style="color:var(--bad);">Clear my attempts</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('btnChangeName').addEventListener('click', ()=>{ overlay.remove(); renderNameModal(); });
  document.getElementById('btnClearMyData').addEventListener('click', ()=>{ overlay.remove(); renderClearDataConfirm(); });
  setTimeout(()=>{
    document.addEventListener('click', function closeOnOutside(e){
      if(!overlay.contains(e.target) && e.target.id!=='railAvatar'){
        overlay.remove();
        document.removeEventListener('click', closeOnOutside);
      }
    });
  }, 0);
}

function renderClearDataConfirm(){

  overlay.id='clearDataConfirmOverlay';
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:420px;">
    <h2>Clear your attempts?</h2>
    <div style="color:var(--text2);font-size:13px;margin-bottom:16px;">This permanently deletes all ${count} of your saved attempts - your personal history and your entries in the shared team log. This cannot be undone. Nobody else's attempts are affected.</div>
    <div style="display:flex;gap:10px;">

function renderNameModal(){
  const overlay=document.createElement('div');
  overlay.id='nameModalOverlay';
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:420px;">
    <h2>What\u2019s your name?</h2>
    <div style="color:var(--text2);font-size:13px;margin-bottom:16px;">Used to label your results in Team Progress. Your attempt details, including transcripts and documentation, are saved there for your TL/management to review as part of coaching. Just your name, no account or password.</div>
    <input id="nameModalInput" type="text" placeholder="e.g. Poojan Solanki" style="width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-family:inherit;font-size:13.5px;">
    <div style="margin-top:16px;"><button id="btnSaveName" class="primary">Continue</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const input = document.getElementById('nameModalInput');
  input.focus();
  const submit = async ()=>{
    const val = input.value.trim();
    if(!val) return;
    await saveAgentName(val);
    overlay.remove();
    render();
  };
  document.getElementById('btnSaveName').addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

// Not real security - this password lives in readable page source, same as everything else here.
// It's a friction gate against casual/curious clicking, not a boundary against someone determined
// to read the code. Treat it exactly that way when deciding what's safe to put in Team Progress.
const TL_AREA_PASSWORD = 'bringtheolives';

function renderTLPasswordModal(){
  let existing=document.getElementById('tlPasswordOverlay');
  if(existing) existing.remove();
  const overlay=document.createElement('div');
  overlay.id='tlPasswordOverlay';
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:380px;">
    <h2>TL / Management Area</h2>
    <div style="color:var(--text2);font-size:13px;margin-bottom:16px;">Team Progress, the full scenario list, and the test suite live here. For team leads, seniors, and L&D only.</div>
    <input id="tlPasswordInput" type="password" placeholder="Password" style="width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-family:inherit;font-size:13.5px;">
    <div id="tlPasswordError" style="color:var(--bad);font-size:12.5px;margin-top:8px;display:none;">That\u2019s not it - try again.</div>
    <div style="margin-top:16px;display:flex;gap:10px;">
      <button id="btnCancelTLPassword">Cancel</button>
      <button id="btnSubmitTLPassword" class="primary">Unlock</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const input = document.getElementById('tlPasswordInput');
  input.focus();
  const submit = ()=>{
    const val = input.value.trim().toLowerCase();
    if(val === TL_AREA_PASSWORD.toLowerCase()){
      state.tlUnlocked = true;
      overlay.remove();
      state.view = 'diagnostics';
      render();
    }else{
      document.getElementById('tlPasswordError').style.display = 'block';
      input.value = '';
      input.focus();
    }
  };
  document.getElementById('btnSubmitTLPassword').addEventListener('click', submit);
  document.getElementById('btnCancelTLPassword').addEventListener('click', ()=> overlay.remove());
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

  loadAgentName();
  loadPersistedAttemptHistory();
  await loadTeamProgressLog();
  await loadAssignments();

  if(!state.agentName) renderNameModal();
}
init();
